<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f5ef" />
    <title>Checklist Sandbox</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <script src="home.js" defer></script>
  </head>
  <body>
    <main class="page-shell">
      <header class="intro">
        <p class="eyebrow">Checklist Sandbox</p>
        <h1>What are you planning?</h1>
        <p class="intro-copy">Choose a starting point and turn a big moment into a series of small, doable steps.</p>
      </header>

      <section class="choices" aria-label="Choose a checklist">
        <button class="choice choice-coral" type="button" onclick="window.location.href = 'moving-house.html'">
          <span class="choice-icon" aria-hidden="true">↗</span>
          <span class="choice-label">
            <span>Moving House</span>
            <span class="choice-progress" id="moving-house-progress" hidden>
              <span class="choice-progress-label" id="moving-house-progress-label"></span>
              <span class="choice-progress-track" aria-hidden="true"><span class="choice-progress-bar" id="moving-house-progress-bar"></span></span>
            </span>
          </span>
          <span class="choice-arrow" aria-hidden="true">→</span>
        </button>
        <button class="choice choice-blue" type="button">
          <span class="choice-icon" aria-hidden="true">✦</span>
          <span>Starting College</span>
          <span class="choice-arrow" aria-hidden="true">→</span>
        </button>
        <button class="choice choice-yellow" type="button">
          <span class="choice-icon" aria-hidden="true">♡</span>
          <span>New Puppy</span>
          <span class="choice-arrow" aria-hidden="true">→</span>
        </button>
        <button class="choice choice-green" type="button">
          <span class="choice-icon" aria-hidden="true">⌁</span>
          <span>Starting a Business</span>
          <span class="choice-arrow" aria-hidden="true">→</span>
        </button>
      </section>

      <footer class="footer-note">A calmer way to get started.</footer>
    </main>
  </body>
</html>
