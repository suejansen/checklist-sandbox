<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f5ef" />
    <title>Moving House | Checklist Sandbox</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="page-shell checklist-page">
      <a class="back-link" href="index.html" aria-label="Back to checklist selection">← Back</a>

      <header class="checklist-header">
        <p class="eyebrow">Moving House</p>
        <h1>3 Months Out</h1>
        <p class="progress-summary"><span id="progress-percent">0%</span> complete</p>
        <div class="progress-track" role="progressbar" aria-label="Moving house checklist progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div class="progress-bar" id="progress-bar"></div>
        </div>
      </header>

      <ul class="task-list" id="task-list">
        <li class="task-item">
          <input class="task-checkbox" type="checkbox" id="task-1" />
          <label for="task-1">Set a moving budget</label>
        </li>
        <li class="task-item">
          <input class="task-checkbox" type="checkbox" id="task-2" />
          <label for="task-2">Research and book a moving company</label>
        </li>
        <li class="task-item">
          <input class="task-checkbox" type="checkbox" id="task-3" />
          <label for="task-3">Sort through belongings and declutter</label>
        </li>
      </ul>
    </main>
  </body>
</html>
